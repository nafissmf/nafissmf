<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.5" stop-color="#150c2e"/>
      <stop offset="1" stop-color="#06202b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#8B5CF6;#EC4899;#06B6D4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#06B6D4;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b">
        <animate attributeName="stdDeviation" values="4;10;4" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <g>
      <rect x="-40" y="-40" width="1080" height="380" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </g>

    <circle cx="150" cy="80" r="90" fill="#06B6D4" opacity="0.35" filter="url(#soft)">
      <animate attributeName="cx" values="150;300;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;200;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="220" r="100" fill="#8B5CF6" opacity="0.40" filter="url(#soft)">
      <animate attributeName="cx" values="850;700;850" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;90;220" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="300" r="80" fill="#EC4899" opacity="0.22" filter="url(#soft)">
      <animate attributeName="cx" values="400;620;400" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#06B6D4">
      <text x="60" y="320" opacity="0">01
        <animate attributeName="y" from="320" to="-20" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="170" y="320" opacity="0" fill="#8B5CF6">1011
        <animate attributeName="y" from="320" to="-20" dur="9s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="300" y="320" opacity="0">SQL
        <animate attributeName="y" from="320" to="-20" dur="8s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="2s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="320" opacity="0" fill="#EC4899">0110
        <animate attributeName="y" from="320" to="-20" dur="10s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="580" y="320" opacity="0">ETL
        <animate attributeName="y" from="320" to="-20" dur="7.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="710" y="320" opacity="0" fill="#8B5CF6">110
        <animate attributeName="y" from="320" to="-20" dur="9s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      </text>
      <text x="830" y="320" opacity="0">API
        <animate attributeName="y" from="320" to="-20" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="930" y="320" opacity="0" fill="#EC4899">01
        <animate attributeName="y" from="320" to="-20" dur="7s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="0" y="0" width="1000" height="2" fill="#06B6D4" opacity="0.35">
      <animate attributeName="y" from="-4" to="304" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="8" fill="#06B6D4">
      // DATA · SYSTEMS · WEB
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">NAFIS MUFADHAL</text>

    <rect x="300" y="165" width="400" height="3" rx="1.5" fill="url(#neon)">
      <animate attributeName="width" values="40;400;400;40" keyTimes="0;0.4;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="480;300;300;480" keyTimes="0;0.4;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#E6EDF3" text-anchor="middle">
      <text x="500" y="222" opacity="0">&gt; Data Analyst_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="222" opacity="0">&gt; Data Engineer_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="222" opacity="0">&gt; Systems Analyst_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="222" opacity="0">&gt; Web Developer_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <g fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round">
      <path d="M24 56V24H56"/>
      <path d="M944 24H976V56"/>
      <path d="M24 244V276H56"/>
      <path d="M976 244V276H944"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="997" height="297" rx="17" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8"/>
</svg>
