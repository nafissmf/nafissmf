<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#150c2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#8B5CF6;#EC4899;#06B6D4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="2;7;2" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="160" fill="url(#bg)"/>

  <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">Let's build something useful together</text>
  <text x="500" y="90" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#8B9CB3">
    OPEN TO WORK
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <path fill="#8B5CF6" fill-opacity="0.35" d="M0 120 q62.5 -26 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 L1500 160 L0 160 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path fill="#06B6D4" fill-opacity="0.35" d="M-125 130 q62.5 -20 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 L1500 160 L-125 160 Z">
    <animateTransform attributeName="transform" type="translate" from="-250 0" to="0 0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path fill="#EC4899" fill-opacity="0.30" d="M0 142 q62.5 -14 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 L1500 160 L0 160 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="3.5s" repeatCount="indefinite"/>
  </path>
</svg>
