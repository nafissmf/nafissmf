<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="13" width="1000" height="2" fill="url(#base)"/>

  <rect y="12" width="180" height="4" rx="2" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" from="-180" to="1000" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(500 14)">
    <rect x="-6" y="-6" width="12" height="12" fill="#8B5CF6" transform="rotate(45)" filter="url(#glow)">
      <animate attributeName="fill" values="#06B6D4;#8B5CF6;#EC4899;#06B6D4" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle r="3" fill="#fff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
