<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1400px; height: 210px; overflow: hidden; background: #0b0c0a; }
    .row {
      width: 1400px;
      height: 210px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #0b0c0a;
      color: #f3efe4;
      font-family: Outfit, sans-serif;
      border-top: 1px solid rgba(243, 239, 228, 0.14);
      border-bottom: 1px solid rgba(243, 239, 228, 0.14);
    }
    .cell {
      padding: 36px 40px 0 48px;
      border-right: 1px solid rgba(243, 239, 228, 0.14);
    }
    .cell:last-child { border-right: 0; }
    .num {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 78px;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: #d6ff4a;
    }
    .label {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 0.16em;
      font-weight: 500;
      color: rgba(243, 239, 228, 0.62);
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <div class="num">3.57</div>
      <div class="label">INFORMATICS GPA</div>
    </div>
    <div class="cell">
      <div class="num">267</div>
      <div class="label">THESIS RESPONDENTS</div>
    </div>
    <div class="cell">
      <div class="num">82</div>
      <div class="label">HMIF MEMBERS</div>
    </div>
    <div class="cell">
      <div class="num">GCP</div>
      <div class="label">BANGKIT CLOUD TRACK</div>
    </div>
  </div>
</body>
</html>
