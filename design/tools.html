<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1400px; height: 196px; overflow: hidden; background: #0b0c0a; }
    .wrap {
      width: 1400px;
      height: 196px;
      padding: 28px 48px 0;
      background: #0b0c0a;
      color: #f3efe4;
      font-family: Outfit, sans-serif;
      border-top: 1px solid rgba(243, 239, 228, 0.14);
      border-bottom: 1px solid rgba(243, 239, 228, 0.14);
    }
    .line {
      display: flex;
      align-items: baseline;
      gap: 28px;
      height: 46px;
      border-bottom: 1px solid rgba(243, 239, 228, 0.1);
      font-size: 18px;
      letter-spacing: 0.04em;
    }
    .line:last-child { border-bottom: 0; }
    .k {
      width: 92px;
      flex: none;
      color: #d6ff4a;
      font-size: 12px;
      letter-spacing: 0.22em;
      font-weight: 600;
    }
    span { color: rgba(243, 239, 228, 0.88); font-weight: 400; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="line"><div class="k">DATA</div><span>Python</span><span>Pandas</span><span>Jupyter</span><span>Power BI</span><span>SmartPLS</span></div>
    <div class="line"><div class="k">CLOUD</div><span>Google Cloud</span><span>MySQL</span><span>PostgreSQL</span><span>Docker</span></div>
    <div class="line"><div class="k">BUILD</div><span>Laravel</span><span>PHP</span><span>JavaScript</span><span>TypeScript</span><span>Git</span></div>
  </div>
</body>
</html>
